[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicherheitscheck"
version = "0.1.0"
description = "Sicherheitscheck fuer Projektordner: mehrere Werkzeuge, ein Bericht"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sicherheitscheck = "sicherheitscheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
